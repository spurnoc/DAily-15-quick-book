  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:36px 28px; text-align:center; }
  h1 { font-size:1.75rem; margin:0 0 8px; }
  p { margin:0 0 12px; color:var(--muted); }
  a { color:var(--accent); }
  footer { max-width:560px; margin:0 auto; padding:0 16px 40px; color:var(--muted); font-size:.9rem; text-align:center; }
